<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>__PAGE_TITLE__</title>
<style>
:root {
  --brand: #0284c7;
  --brand-dark: #0369a1;
  --brand-light: #e0f2fe;
  --accent-gold: #f59e0b;
  --accent-gold-dark: #b45309;
  --accent-green: #10b981;
  --accent-red: #ef4444;
  --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-sub: #475569;
  --border-radius: 20px;
  --shadow-lg: 0 16px 36px rgba(2, 132, 199, 0.12);
  --shadow-candy: 0 6px 0 rgba(0, 0, 0, 0.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background: var(--bg-gradient);
  min-height: 100vh;
  color: var(--text-main);
  padding: 14px 10px 40px;
  display: flex;
  justify-content: center;
}

.app-container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.font-fun {
  font-weight: 800;
  letter-spacing: -0.3px;
}

/* Header */
.header-card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 12px 18px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 2px solid #bae6fd;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-badge {
  font-size: 11px;
  font-weight: 800;
  color: #0369a1;
  background: #e0f2fe;
  padding: 3px 8px;
  border-radius: 999px;
  display: inline-block;
  margin-bottom: 2px;
}

.header-title {
  font-size: 15px;
  color: #0284c7;
  font-weight: 800;
}

.header-student {
  background: #e0f2fe;
  color: #0369a1;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1.5px solid #bae6fd;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all .2s;
}
.header-student:hover {
  background: #bae6fd;
  transform: translateY(-1px);
}

.btn-home {
  background: #f8fafc;
  border: 1.5px solid #cbd5e1;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 800;
  color: #475569;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 2px 0 #cbd5e1;
  transition: all .15s ease;
}
.btn-home:active {
  transform: translateY(2px);
  box-shadow: none;
}

/* Car Progress Track */
.track-box {
  background: #fff;
  border-radius: 16px;
  padding: 8px 14px;
  border: 1.5px solid #bae6fd;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
  display: none;
}
.track-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 800;
  color: #0369a1;
  margin-bottom: 4px;
}
.track-rail {
  position: relative;
  height: 14px;
  background: #e2e8f0;
  border-radius: 999px;
  overflow: visible;
}
.track-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #0284c7);
  border-radius: 999px;
  width: 0%;
  transition: width .3s ease;
}
.car-marker {
  position: absolute;
  top: -9px;
  left: 0%;
  transform: translateX(-50%);
  font-size: 20px;
  transition: left .3s ease;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
}

/* Main View Card */
.view-card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 20px 18px;
  box-shadow: var(--shadow-lg);
  border: 2px solid #bae6fd;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Mascot & Greeting */
.owl-greeting {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #f0f9ff;
  border: 1.5px solid #bae6fd;
  border-radius: 16px;
  padding: 12px;
}
.owl-bubble {
  font-size: 13.5px;
  color: #0369a1;
  line-height: 1.45;
  font-weight: 600;
}

/* Form Inputs for Student Info */
.finput {
  width: 100%;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 12px;
  border: 2px solid #bae6fd;
  outline: none;
  box-sizing: border-box;
  transition: border-color .2s;
}
.finput:focus {
  border-color: #0284c7;
  background: #f0f9ff;
}

/* Audio Player Container */
.audio-player-box {
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
  border-radius: 18px;
  padding: 14px 16px;
  color: #fff;
  box-shadow: 0 8px 20px rgba(2, 132, 199, 0.28);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.audio-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.audio-title {
  font-size: 13.5px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
}
.audio-time {
  font-size: 12px;
  font-weight: 700;
  color: #bae6fd;
  font-variant-numeric: tabular-nums;
}
.audio-controls-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-audio {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #fff;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all .15s ease;
}
.btn-audio:hover {
  background: rgba(255, 255, 255, 0.3);
}
.btn-audio.primary {
  background: #fff;
  color: #0284c7;
  font-size: 13.5px;
  padding: 8px 18px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}
.btn-audio.primary.playing {
  background: #fef08a;
  color: #854d0e;
}
.audio-slider-container {
  width: 100%;
}
.audio-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.35);
  outline: none;
  cursor: pointer;
}
.audio-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  cursor: pointer;
}
.audio-jump-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 2px;
}
.jump-chip {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #e0f2fe;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s ease;
}
.jump-chip:hover {
  background: #fff;
  color: #0284c7;
}

/* Word Bank Chips Box (Part 2, 6, 9) */
.word-bank-box {
  background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
  border: 2px dashed #f59e0b;
  border-radius: 16px;
  padding: 12px 14px;
}
.word-bank-header {
  font-size: 12.5px;
  font-weight: 800;
  color: #b45309;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.word-bank-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.word-chip {
  background: #ffffff;
  color: #92400e;
  border: 1.5px solid #fde68a;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 800;
  box-shadow: 0 2px 4px rgba(245, 158, 11, 0.15);
}

/* Reading Passage Card (Part 8 & Part 9) */
.reading-card-box {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border: 2px solid #f59e0b;
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.12);
}
.reading-card-box.nam-box {
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
  border-color: #3b82f6;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
}
.reading-card-header {
  font-weight: 800;
  font-size: 13px;
  color: #b45309;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.nam-box .reading-card-header {
  color: #1d4ed8;
}
.reading-img-wrap {
  text-align: center;
  margin-bottom: 10px;
}
.reading-img {
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  border: 1px solid rgba(0,0,0,0.06);
}
.reading-text-card {
  background: #ffffff;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14.5px;
  line-height: 1.65;
  color: #1e293b;
  border-left: 4px solid #f59e0b;
}
.nam-box .reading-text-card {
  border-left: 4px solid #3b82f6;
}
.reading-text-card p {
  margin: 4px 0;
}
.blank-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  background: #f1f5f9;
  border: 1.5px dashed #94a3b8;
  font-weight: 700;
  color: #475569;
  font-size: 13px;
}
.blank-chip.active-blank {
  background: #fef08a !important;
  border: 2px solid #eab308 !important;
  color: #854d0e !important;
  box-shadow: 0 0 10px rgba(234, 179, 8, 0.6) !important;
  animation: pulseBlank 1.2s infinite;
}
@keyframes pulseBlank {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}
.nam-guide-note {
  margin-top: 8px;
  font-size: 12.5px;
  color: #1e40af;
  font-weight: 600;
}

/* Dialogue Card (Part 10) */
.dialogue-box {
  background: #f8fafc;
  border: 2px solid #cbd5e1;
  border-radius: 16px;
  padding: 14px;
}
.dialogue-title {
  font-size: 13px;
  font-weight: 800;
  color: #334155;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dialogue-lines {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13.5px;
  line-height: 1.45;
}
.dialogue-line {
  padding: 4px 8px;
  border-radius: 8px;
}
.dialogue-line.spk-a {
  background: #fdf2f8;
  color: #9d174d;
  font-weight: 700;
}
.dialogue-line.spk-b {
  background: #f0fdf4;
  color: #166534;
  font-weight: 700;
}

/* Question Box */
.q-box {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.q-top-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.q-badge {
  font-size: 12px;
  font-weight: 800;
  color: #0369a1;
  background: #e0f2fe;
  padding: 4px 10px;
  border-radius: 999px;
}

.timer-circle-wrap {
  position: relative;
  width: 44px;
  height: 44px;
}
.timer-svg {
  width: 44px;
  height: 44px;
  transform: rotate(-90deg);
}
.timer-bg {
  fill: none;
  stroke: #e2e8f0;
  stroke-width: 4;
}
.timer-path {
  fill: none;
  stroke: #10b981;
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke-dasharray 1s linear, stroke .3s ease;
}
.timer-number {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px;
  font-weight: 900;
  color: #0f172a;
  font-variant-numeric: tabular-nums;
}

.q-image-box {
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid #bae6fd;
  background: #f8fafc;
  display: flex;
  justify-content: center;
  align-items: center;
}
.q-image {
  max-width: 100%;
  max-height: 280px;
  object-fit: contain;
  display: block;
}

.prompt-text {
  font-size: 15.5px;
  font-weight: 700;
  color: #0f172a;
  line-height: 1.45;
}

.prompt-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn-speech, .btn-audio-jump {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Options Grid */
.opts-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
}
.opts-grid.two-cols {
  grid-template-columns: 1fr 1fr;
}

.btn-opt {
  background: #ffffff;
  border: 2px solid #bae6fd;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 700;
  color: #1e293b;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 4px 0 #bae6fd;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .15s ease;
}
.btn-opt:hover:not(:disabled) {
  border-color: #38bdf8;
  background: #f0f9ff;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #bae6fd;
}
.btn-opt:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #bae6fd;
}
.btn-opt:disabled {
  cursor: default;
}

.opt-prefix {
  background: #e0f2fe;
  color: #0284c7;
  font-weight: 900;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}

.btn-opt.correct {
  background: #ecfdf5 !important;
  border-color: #10b981 !important;
  color: #047857 !important;
  box-shadow: 0 4px 0 #10b981 !important;
}
.btn-opt.correct .opt-prefix {
  background: #10b981 !important;
  color: #ffffff !important;
}

.btn-opt.wrong {
  background: #fef2f2 !important;
  border-color: #ef4444 !important;
  color: #b91c1c !important;
  box-shadow: 0 4px 0 #ef4444 !important;
}
.btn-opt.wrong .opt-prefix {
  background: #ef4444 !important;
  color: #ffffff !important;
}

/* Explanation Box */
.expl-box {
  display: none;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.45;
  animation: fadeIn .2s ease;
}
.expl-box.show {
  display: block;
}
.expl-box.correct-theme {
  background: #ecfdf5;
  border: 1.5px solid #a7f3d0;
  color: #065f46;
}
.expl-box.wrong-theme {
  background: #fef2f2;
  border: 1.5px solid #fecaca;
  color: #991b1b;
}

/* Action Row */
.action-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
}

/* Button Styles */
.btn {
  background: #0284c7;
  color: #ffffff;
  border: none;
  border-radius: 14px;
  padding: 11px 20px;
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 0 #0369a1;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .15s ease;
}
.btn:hover {
  background: #0369a1;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #075985;
}
.btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #075985;
}
.btn.gold {
  background: #f59e0b;
  box-shadow: 0 4px 0 #b45309;
}
.btn.gold:hover {
  background: #d97706;
  box-shadow: 0 6px 0 #92400e;
}
.btn.secondary {
  background: #f1f5f9;
  color: #334155;
  box-shadow: 0 4px 0 #cbd5e1;
}

/* Table of Contents Grid */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.sec-item-btn {
  background: #ffffff;
  border: 2px solid #bae6fd;
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 3px 0 #bae6fd;
  transition: all .15s ease;
}
.sec-item-btn:hover {
  border-color: #38bdf8;
  background: #f0f9ff;
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #bae6fd;
}
.sec-icon {
  font-size: 24px;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #e0f2fe;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sec-title {
  font-size: 14px;
  font-weight: 800;
  color: #0f172a;
}
.sec-desc {
  font-size: 12px;
  color: #64748b;
  margin-top: 2px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header-card">
    <div class="header-left">
      <div>
        <div class="header-badge">__BADGE__</div>
        <div class="header-title font-fun">__HEADER_TITLE__</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="header-student" id="studentPill" style="display:none;" onclick="renderStudentInfoScreen()" title="Bấm để đổi thông tin học sinh">
        👤 <span id="studentNameDisplay">Học sinh</span> ✏️
      </div>
      <button class="btn-home" onclick="goToHome()">
        <span>🏠</span>
        <span>Mục lục</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar (Car) -->
  <div class="track-box" id="trackBox">
    <div class="track-header">
      <span id="trackLabel">Tiến độ làm bài</span>
      <span id="trackPct">0% (0/0)</span>
    </div>
    <div class="track-rail">
      <div class="track-fill" id="trackFill"></div>
      <div class="car-marker" id="carMarker">🚗</div>
    </div>
  </div>

  <!-- Dynamic View -->
  <div id="dynamicView"></div>
</div>

<script>
/* Cyrb53 Decryption & Salt Verification */
const ANS_SALT = "wtg_v2_2026";
function normalize(s) {
  if (typeof s === "object" && s !== null) s = s.text || s.label || s.value || "";
  s = String(s || "").normalize("NFC").trim().toLowerCase();
  s = s.replace(/['`\u2019]/g, "'");
  let res = "";
  for (const ch of s) {
    if (/[\p{L}\p{N}]/u.test(ch)) res += ch;
    else res += " ";
  }
  return res.split(/\s+/).filter(Boolean).join(" ");
}
function cyrb53(s, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < s.length; i++) {
    let ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function hashAns(val) {
  return cyrb53(ANS_SALT + normalize(val)).toString(16);
}
function b64d(str) {
  try {
    return decodeURIComponent(escape(atob(str)));
  } catch (e) {
    return atob(str);
  }
}

/* Web Audio SFX */
class SoundEffects {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  beep() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
    osc.frequency.setValueAtTime(880.00, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
  buzz() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
  fanfare() {
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
      osc.start(this.ctx.currentTime + idx * 0.1);
      osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
    });
  }
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = (typeof SET !== 'undefined' && SET.speechLang) || 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

}

function mediaSrc(k){ return k ? (MEDIA[k] || "") : ""; }

/* Audio Player Engine */
let AUDIO_PLAYER = null;
let CURRENT_AUDIO_KEY = null;

function getAudioSource(key) {
  return mediaSrc(key);
}

function initOrGetPlayer(key) {
  if (!AUDIO_PLAYER || CURRENT_AUDIO_KEY !== key) {
    if (AUDIO_PLAYER) {
      AUDIO_PLAYER.pause();
    }
    const src = getAudioSource(key);
    AUDIO_PLAYER = new Audio(src);
    CURRENT_AUDIO_KEY = key;
    AUDIO_PLAYER.ontimeupdate = updateAudioUI;
    AUDIO_PLAYER.onended = () => {
      const btn = document.getElementById("masterPlayBtn");
      if (btn) {
        btn.classList.remove("playing");
        btn.innerHTML = "▶ Bật âm thanh";
      }
    };
  }
  return AUDIO_PLAYER;
}

function toggleAudio() {
  if (!CUR.sec || !CUR.sec.audio) return;
  const p = initOrGetPlayer(CUR.sec.audio);
  const btn = document.getElementById("masterPlayBtn");
  if (p.paused) {
    p.play().then(() => {
      if (btn) {
        btn.classList.add("playing");
        btn.innerHTML = "⏸ Tạm dừng";
      }
    }).catch(err => console.warn(err));
  } else {
    p.pause();
    if (btn) {
      btn.classList.remove("playing");
      btn.innerHTML = "▶ Tiếp tục nghe";
    }
  }
}

function seekRelative(sec) {
  if (!AUDIO_PLAYER) return;
  AUDIO_PLAYER.currentTime = Math.max(0, Math.min(AUDIO_PLAYER.duration || 999, AUDIO_PLAYER.currentTime + sec));
}

function replayFromStart() {
  if (!AUDIO_PLAYER) return;
  AUDIO_PLAYER.currentTime = 0;
  AUDIO_PLAYER.play().catch(e => console.warn(e));
  const btn = document.getElementById("masterPlayBtn");
  if (btn) {
    btn.classList.add("playing");
    btn.innerHTML = "⏸ Tạm dừng";
  }
}

function seekAudio(sec) {
  const p = initOrGetPlayer(CUR.sec.audio);
  p.currentTime = sec;
  p.play().catch(e => console.warn(e));
  const btn = document.getElementById("masterPlayBtn");
  if (btn) {
    btn.classList.add("playing");
    btn.innerHTML = "⏸ Tạm dừng";
  }
}

function onSliderInput(val) {
  if (!AUDIO_PLAYER || !AUDIO_PLAYER.duration) return;
  const target = (val / 100) * AUDIO_PLAYER.duration;
  const timeEl = document.getElementById("audioTimeDisplay");
  if (timeEl) timeEl.textContent = `${fmtTime(target)} / ${fmtTime(AUDIO_PLAYER.duration)}`;
}

function onSliderChange(val) {
  if (!AUDIO_PLAYER || !AUDIO_PLAYER.duration) return;
  seekAudio((val / 100) * AUDIO_PLAYER.duration);
}

function fmtTime(sec) {
  if (isNaN(sec) || sec === null || sec === undefined) return "00:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateAudioUI() {
  if (!AUDIO_PLAYER) return;
  const cur = AUDIO_PLAYER.currentTime || 0;
  const dur = AUDIO_PLAYER.duration || CUR.sec.duration || 1;
  const timeEl = document.getElementById("audioTimeDisplay");
  if (timeEl) timeEl.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
  const slider = document.getElementById("audioSlider");
  if (slider && !slider.matches(":active")) {
    slider.value = (cur / dur) * 100;
  }
}

          <div class="timer-circle-wrap">
            <svg class="timer-svg" viewBox="0 0 36 36">
              <path class="timer-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path class="timer-path" id="timerPath" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <div class="timer-number" id="timerText">${SET.secondsPerQuestion}s</div>
          </div>
        </div>

        ${imgHtml}

        <div class="prompt-text">${qNum}. ${promptClean.replace(/\n/g, '<br>')}</div>

        <div class="prompt-actions">
          ${jumpBtnHtml}
          <button class="btn-speech" onclick="speakCurrent()">
            🔊 Đọc câu hỏi
          </button>
        </div>

        <div class="opts-grid ${isTwoCols ? 'two-cols' : ''}" id="optsGrid">
          ${optsHtml}
        </div>

        <div class="expl-box" id="explBox"></div>

        <div class="action-row" id="actionRow" style="display:none;">
          <div style="font-size:13px; font-weight:800; color:#0369a1;" id="feedbackPoints"></div>
          <button class="btn" id="nextBtn" onclick="nextItem()">
            Câu tiếp theo ➔
          </button>
        </div>
      </div>
    </div>
  `;

  startTimer();
}

/* Timer mỗi câu (SET.secondsPerQuestion) */
function startTimer() {
  clearTimer();
  CUR.timeLeft = SET.secondsPerQuestion;
  CUR.totalTime = SET.secondsPerQuestion;
  const path = document.getElementById("timerPath");
  const text = document.getElementById("timerText");
  if (text) text.textContent = SET.secondsPerQuestion + "s";
  if (path) {
    path.setAttribute("stroke-dasharray", "100, 100");
    path.style.stroke = "#10b981";
  }

  CUR.timer = setInterval(() => {
    CUR.timeLeft--;
    if (text) text.textContent = CUR.timeLeft + "s";

    if (path) {
      const pct = (CUR.timeLeft / CUR.totalTime) * 100;
      path.setAttribute("stroke-dasharray", `${pct}, 100`);
      if (pct > 50) path.style.stroke = "#10b981";
      else if (pct > 20) path.style.stroke = "#f59e0b";
      else path.style.stroke = "#ef4444";
    }

    if (CUR.timeLeft <= 0) {
      clearTimer();
      timeOut();
    }
  }, 1000);
}

function clearTimer() {
  if (CUR.timer) {
    clearInterval(CUR.timer);
    CUR.timer = null;
  }
}

function timeOut() {
  sfx.buzz();
  disableAllOpts();
  const item = CUR.items[CUR.itemIdx];
  const explText = b64d(item.e);
  const fullAns = b64d(item.full);

  item.options.forEach((opt, idx) => {
    if (opt.hash === item.ans) {
      document.getElementById(`optBtn_${idx}`).classList.add("correct");
    }
  });

  const eb = document.getElementById("explBox");
  eb.className = "expl-box show wrong-theme";
  eb.innerHTML = `<b>⏰ Hết thời gian ${SET.secondsPerQuestion}s!</b> Đáp án đúng là: <b>${fullAns}</b><br><br>💡 <b>Giải thích:</b> ${explText}`;

  WRONG_LOG.push({
    secTitle: CUR.sec.title,
    prompt: item.prompt,
    full: fullAns,
    expl: explText
  });

  document.getElementById("feedbackPoints").innerHTML = `<span style="color:#ef4444;">+0 điểm</span>`;
  document.getElementById("actionRow").style.display = "flex";
}

function selectChoice(chosenIdx) {
  clearTimer();
  disableAllOpts();

  const item = CUR.items[CUR.itemIdx];
  const chosenOpt = item.options[chosenIdx];
  const isCorrect = (chosenOpt.hash === item.ans);
  const btn = document.getElementById(`optBtn_${chosenIdx}`);
  const eb = document.getElementById("explBox");
  const explText = b64d(item.e);
  const fullAns = b64d(item.full);

  if (isCorrect) {
    sfx.beep();
    btn.classList.add("correct");
    CUR.correct++;

    const speedBonus = Math.round((CUR.timeLeft / CUR.totalTime) * SET.maxSpeedBonus);
    const pts = SET.basePoints + speedBonus;
    CUR.points += pts;
    RUNNING_POINTS += pts;

    eb.className = "expl-box show correct-theme";
    eb.innerHTML = `<b>🎉 Chính xác!</b> (+${pts} điểm)<br><br>💡 <b>Giải thích:</b> ${explText}`;

    document.getElementById("feedbackPoints").innerHTML = `<span style="color:#10b981;">+${pts} điểm (Thưởng tốc độ: +${speedBonus}đ)</span>`;
  } else {
    sfx.buzz();
    btn.classList.add("wrong");

    item.options.forEach((opt, idx) => {
      if (opt.hash === item.ans) {
        document.getElementById(`optBtn_${idx}`).classList.add("correct");
      }
    });

    eb.className = "expl-box show wrong-theme";
    eb.innerHTML = `<b>❌ Chưa chính xác!</b> Đáp án đúng là: <b>${fullAns}</b><br><br>💡 <b>Giải thích:</b> ${explText}`;

    WRONG_LOG.push({
      secTitle: CUR.sec.title,
      prompt: item.prompt,
      full: fullAns,
      expl: explText
    });

    document.getElementById("feedbackPoints").innerHTML = `<span style="color:#ef4444;">+0 điểm</span>`;
  }

  document.getElementById("actionRow").style.display = "flex";
}

function disableAllOpts() {
  const opts = document.querySelectorAll(".btn-opt");
  opts.forEach(b => b.disabled = true);
}

function nextItem() {
  CUR.itemIdx++;
  if (CUR.itemIdx < CUR.items.length) {
    renderItem();
  } else {
    finishSection();
  }
}

function finishSection() {
  if (AUDIO_PLAYER) AUDIO_PLAYER.pause();
  SECTION_RESULTS.push({
    title: CUR.sec.title,
    correct: CUR.correct,
    total: CUR.items.length,
    points: CUR.points
  });

  if (CUR.isAll && (CUR.secIdx + 1 < WORKSHEET.sections.length)) {
    startSection(CUR.secIdx + 1, true);
  } else {
    renderSummary();
  }
}

function renderSummary() {
  trackBox.style.display = "none";
  sfx.fanfare();

  let totalC = 0, totalQ = 0, totalPts = 0;
  SECTION_RESULTS.forEach(r => {
    totalC += r.correct;
    totalQ += r.total;
    totalPts += r.points;
  });

  const pct = Math.round((totalC / totalQ) * 100);
  const score10 = ((totalC / totalQ) * 10).toFixed(1);

  let stars = "⭐";
  let gradeText = "Cần Cố Gắng Thêm";
  if (pct >= 85) {
    stars = "⭐⭐⭐";
    gradeText = "Xuất Sắc! " + (WORKSHEET.champTitle || "Thần Đồng");
  } else if (pct >= 65) {
    stars = "⭐⭐";
    gradeText = "Khá Tốt! Đạt Chuẩn";
  }

  let wrongHtml = "";
  if (WRONG_LOG.length > 0) {
    wrongHtml = `
      <div style="background:#fff1f2; border:1.5px solid #fecdd3; border-radius:16px; padding:16px; margin-top:12px; text-align:left;">
        <h3 style="color:#be123c; font-size:15px; font-weight:800; margin-bottom:8px;">
          📚 Danh Sách Câu Cần Ôn Lại (${WRONG_LOG.length} câu):
        </h3>
        <div style="display:flex; flex-direction:column; gap:10px; max-height:220px; overflow-y:auto;">
          ${WRONG_LOG.map((w, idx) => `
            <div style="background:#fff; padding:10px; border-radius:10px; border:1px solid #ffe4e6; font-size:13px;">
              <b>Câu ${idx + 1}:</b> ${w.prompt.replace(/^\d+[\.\)]\s*/, '')}<br>
              <span style="color:#10b981;">➔ Đáp án đúng: <b>${w.full}</b></span><br>
              <span style="color:#64748b; font-size:12px;">💡 ${w.expl}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  const dateStr = new Date().toLocaleString('vi-VN');
  view.innerHTML = `
    <div class="view-card" style="text-align:center;">
      <div style="font-size:42px;">🏆</div>
      <h2 class="font-fun" style="color:#0369a1; font-size:24px;">BẢNG VÀNG CHỨNG NHẬN VIP</h2>
      <p style="color:#64748b; font-size:13.5px; margin-bottom:12px;">${WORKSHEET.title}</p>

      <!-- Khung vinh danh học sinh -->
      <div style="background:#fffbeb; border:2px solid #fde68a; border-radius:16px; padding:16px; margin-bottom:16px;">
        <div style="font-size:12px; font-weight:800; color:#b45309; letter-spacing:1px;">CHỨNG NHẬN VINH DANH HỌC SINH:</div>
        <div style="font-size:26px; font-weight:900; color:#b45309; margin:6px 0 2px;">${STUDENT.name || "Học sinh"}</div>
        <div style="font-size:13px; color:#64748b; font-weight:700;">
          ${STUDENT.cls ? ('Lớp: ' + STUDENT.cls + ' · ') : ''}${dateStr}
        </div>
      </div>

      <div style="font-size:32px; margin:8px 0;">${stars}</div>
      <div style="font-size:18px; font-weight:900; color:#0f172a;">${gradeText}</div>

      <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin:16px 0;">
        <div style="background:#f0f9ff; padding:12px; border-radius:14px; border:1px solid #bae6fd;">
          <div style="font-size:12px; font-weight:800; color:#0369a1;">ĐIỂM SỐ (HỆ 10)</div>
          <div style="font-size:22px; font-weight:900; color:#0284c7;">${score10}</div>
        </div>
        <div style="background:#ecfdf5; padding:12px; border-radius:14px; border:1px solid #a7f3d0;">
          <div style="font-size:12px; font-weight:800; color:#047857;">SỐ CÂU ĐÚNG</div>
          <div style="font-size:22px; font-weight:900; color:#10b981;">${totalC} / ${totalQ}</div>
        </div>
        <div style="background:#fef3c7; padding:12px; border-radius:14px; border:1px solid #fde68a;">
          <div style="font-size:12px; font-weight:800; color:#b45309;">TỔNG ĐIỂM</div>
          <div style="font-size:22px; font-weight:900; color:#d97706;">${totalPts}</div>
        </div>
      </div>

      <div style="font-size:13px; font-weight:800; color:#0369a1; background:#e0f2fe; padding:8px 14px; border-radius:10px; display:inline-block; margin-bottom:8px;">
        📸 Em hãy chụp lại màn hình Bảng Vàng Chứng Nhận để gửi cho thầy cô giáo nhé!
      </div>

      ${wrongHtml}

      <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
        <button class="btn gold" onclick="startWorksheet()">
          🔄 Làm lại Toàn bộ Đề
        </button>
        <button class="btn" onclick="goToHome()">
          🏠 Về Mục Lục
        </button>
      </div>
    </div>
  `;
}

// Initialize
updateStudentUI();
if (!STUDENT.name) {
  renderStudentInfoScreen();
} else {
  renderHome();
}
</script>
